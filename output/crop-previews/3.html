<script>
(() => {
  const root = document.getElementById('photo-crop-comparisons');
  const pairs = root.querySelector('#photo-crop-pairs');
  const photos = JSON.parse(document.getElementById('photo-crop-data').textContent);
  for (const photo of photos) {
    const section = document.createElement('section');
    const title = document.createElement('h3');
    title.textContent = photo.title;
    section.append(title);
    const pair = document.createElement('div');
    pair.className = 'pair';
    for (const cropped of [false, true]) {
      const figure = document.createElement('figure');
      const label = document.createElement('figcaption');
      label.textContent = cropped ? 'Proposed crop' : 'Original';
      const window = document.createElement('div');
      window.className = 'photo-window';
      const [left, top, right, bottom] = cropped ? photo.trim : [0, 0, 0, 0];
      const width = 1 - left - right;
      const height = 1 - top - bottom;
      window.style.aspectRatio = `${photo.width * width} / ${photo.height * height}`;
      const img = document.createElement('img');
      img.src = photo.src;
      img.alt = `${photo.title} — ${cropped ? 'proposed crop' : 'original composition'}`;
      img.style.position = 'absolute';
      img.style.width = `${100 / width}%`;
      img.style.height = 'auto';
      img.style.left = `${-100 * left / width}%`;
      img.style.top = `${-100 * top / height}%`;
      window.append(img);
      figure.append(label, window);
      if (cropped) {
        const detail = document.createElement('div');
        detail.className = 'crop-label text-small';
        detail.textContent = photo.label;
        figure.append(detail);
      }
      pair.append(figure);
    }
    section.append(pair);
    pairs.append(section);
  }
})();
</script>
