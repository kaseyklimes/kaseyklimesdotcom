name: Warm production images
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warm-production-images
  cancel-in-progress: false
jobs:
  warm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run warm-images -- https://www.kaseyklimes.com
